name: Publish reviewed MCP package with provenance
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed release tag, for example v0.6.1
        required: true
        type: string
      confirmation:
        description: Enter PUBLISH to explicitly release the candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'hexablob/ismalicious-mcp-server' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check tag and package identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sourceSha !== process.env.GITHUB_SHA) throw new Error('Release tag must identify the dispatch source commit so provenance names the actual build source');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@ismalicious/mcp-server' || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error('The reviewed release tag must match the package version');
          }
          const url = `https://registry.npmjs.org/@ismalicious%2Fmcp-server/${pkg.version}`;
          const response = await fetch(url);
          if (response.status !== 404) throw new Error(`Expected an unpublished version; registry returned ${response.status}`);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check-version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --audit-level=low
      # Requires a separately configured npm trusted publisher for this exact
      # repository and workflow. No token fallback and no automatic trigger.
      - name: Publish candidate without changing latest
        run: npm publish --provenance --access public --tag review-candidate
      - name: Confirm published attestation metadata
        run: npm run verify-provenance
